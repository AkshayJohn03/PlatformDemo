[project]
name = "platformdemo"
version = "1.0.0"
description = "Vertical integration proof for the AI portfolio: HVAC-Copilot through AegisGate, forensics via ForensiQ, regression gating via VerdictAI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akshay John Xavier", email = "akshay3rishi@gmail.com" }]
keywords = ["integration", "llm-gateway", "rag", "forensics", "eval", "portfolio"]
dependencies = [
    "pytest>=8",
    "httpx>=0.27",
    "pyyaml>=6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

# The four portfolio systems are deliberately NOT in install_requires: they are
# sibling repositories, installed editable from checkouts so this repo always
# integrates against their live source. See .github/workflows/ci.yml and the
# README quickstart:
#   pip install -e ../AegisGate -e ../HVAC-Copilot -e ../ForensiQ \
#               -e ../VerdictAI -e .

[tool.setuptools]
packages = ["demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
